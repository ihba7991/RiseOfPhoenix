<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>DSA Patterns — LeetCode</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');
:root{
  --bg:#080c10;--surface:#0d1117;--surface2:#161b22;--border:#21262d;
  --text:#e6edf3;--muted:#7d8590;--dim:#3d444d;
  --accent:#f0c040;--green:#3fb950;--blue:#79c0ff;--purple:#d2a8ff;--orange:#ff7b72;--pink:#ff9ecd;
  --mono:'Space Mono',monospace;--display:'Syne',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh;padding-bottom:60px}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);pointer-events:none;z-index:9999}
header{padding:48px 40px 24px;border-bottom:1px solid var(--border);position:relative;overflow:hidden}
header::before{content:'PATTERNS';position:absolute;top:-10px;right:-20px;font-family:var(--display);font-size:9rem;font-weight:800;color:rgba(255,255,255,.02);letter-spacing:-.05em;white-space:nowrap;pointer-events:none}
h1{font-family:var(--display);font-size:clamp(2rem,4vw,3rem);font-weight:800;line-height:1;letter-spacing:-.02em}
h1 .accent{color:var(--accent)}
h1 .dim{color:var(--muted);font-weight:400}
.meta{font-size:.7rem;color:var(--muted);letter-spacing:.12em;margin-top:12px;text-transform:uppercase}
.lede{font-size:.76rem;color:var(--muted);margin-top:12px;line-height:1.7;max-width:820px}
.lede b{color:var(--text)}
.bar{height:3px;background:var(--border);margin-top:16px;border-radius:2px;overflow:hidden}
.bar > div{height:100%;background:linear-gradient(90deg,var(--purple),var(--blue),var(--green),var(--accent));width:0;transition:width .3s}
main{padding:22px 40px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:16px}
.pat{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:16px 18px}
.pat-head{display:flex;align-items:baseline;gap:10px;margin-bottom:3px}
.pat-idx{font-family:var(--display);font-size:.9rem;font-weight:800;color:var(--dim);min-width:26px}
.pat-name{font-family:var(--display);font-size:1rem;font-weight:800;letter-spacing:.01em}
.pat-count{margin-left:auto;font-size:.62rem;color:var(--muted);white-space:nowrap}
.pat-hint{font-size:.7rem;color:var(--muted);line-height:1.55;margin:4px 0 12px;padding-left:36px}
.probs{display:flex;flex-direction:column;gap:5px}
.prob{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:3px;border:1px solid var(--border);background:var(--surface2);transition:border-color .15s}
.prob:hover{border-color:var(--cat)}
.prob .cb{width:15px;height:15px;border:1px solid var(--dim);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.55rem;color:var(--green);cursor:pointer}
.prob.done .cb{background:rgba(63,185,80,.15);border-color:var(--green)}
.prob .num{font-size:.66rem;font-weight:700;color:var(--cat);min-width:38px}
.prob a.tt{font-size:.72rem;color:var(--text);text-decoration:none;flex:1;line-height:1.4}
.prob a.tt:hover{text-decoration:underline;text-decoration-color:var(--cat)}
.prob.done a.tt{color:var(--muted);text-decoration:line-through}
.prob .ext{font-size:.6rem;color:var(--dim);text-decoration:none}
.prob .ext:hover{color:var(--cat)}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:8px 24px;display:flex;justify-content:space-between;align-items:center;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);z-index:500}
footer a{color:var(--blue);text-decoration:none}
@media (max-width:600px){header,main{padding-left:18px;padding-right:18px}main{grid-template-columns:1fr}}
</style>
</head>

<!-- riop-ns: per-person localStorage namespacing -->
<script>
(function () {
  var PEOPLE  = ['ihba7991', 'vikku'];
  var PERSON  = (location.pathname.split('/').filter(Boolean)
                 .find(function (s) { return PEOPLE.indexOf(s) !== -1; })) || 'default';
  var NS_KEYS = ['dsa-done'];
  function ns(k){ return NS_KEYS.indexOf(k) !== -1 ? (PERSON + ':' + k) : k; }
  var proto=Storage.prototype, oGet=proto.getItem, oSet=proto.setItem, oDel=proto.removeItem;
  proto.getItem=function(k){return oGet.call(this,ns(k));};
  proto.setItem=function(k,v){return oSet.call(this,ns(k),v);};
  proto.removeItem=function(k){return oDel.call(this,ns(k));};
})();
</script>

const STORAGE_KEY='dsa-done';
function loadDone(){try{return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'));}catch(_){return new Set();}}
function saveDone(s){try{localStorage.setItem(STORAGE_KEY,JSON.stringify([...s]));}catch(_){}}
const done=loadDone();
const grid=document.getElementById('grid');
let TOTAL=0; PATTERNS.forEach(p=>TOTAL+=p.probs.length);

function render(){
  grid.innerHTML='';
  PATTERNS.forEach((p,i)=>{
    const color=CAT_COLOR[p.cat]||'var(--accent)';
    const solved=p.probs.filter(pr=>done.has(pr.n)).length;
    const card=document.createElement('div');
    card.className='pat'; card.style.setProperty('--cat',color);
    let rows='';
    p.probs.forEach(pr=>{
      const isDone=done.has(pr.n);
      const url='https://leetcode.com/problems/'+pr.s+'/';
      rows+=`<div class="prob${isDone?' done':''}" data-n="${pr.n}">
        <div class="cb">${isDone?'✓':''}</div>
        <span class="num">#${pr.n}</span>
        <a class="tt" href="${url}" target="_blank" rel="noopener">${pr.t}</a>
        <a class="ext" href="${url}" target="_blank" rel="noopener">&#8599;</a>
      </div>`;
    });
    card.innerHTML=`
      <div class="pat-head">
        <span class="pat-idx">${String(i+1).padStart(2,'0')}</span>
        <span class="pat-name">${p.name}</span>
        <span class="pat-count">${solved}/${p.probs.length}</span>
      </div>
      <div class="pat-hint">${p.hint}</div>
      <div class="probs">${rows}</div>`;
    grid.appendChild(card);
  });
  document.getElementById('totalCount').textContent=TOTAL;
  document.getElementById('doneCount').textContent=done.size;
  document.getElementById('progressBar').style.width=(100*done.size/TOTAL)+'%';
}

grid.addEventListener('click',e=>{
  const cb=e.target.closest('.cb'); if(!cb) return;
  const row=cb.closest('.prob'); const n=Number(row.dataset.n);
  if(done.has(n)) done.delete(n); else done.add(n);
  saveDone(done); render();
});

render();
</script>
</body>
</html>
